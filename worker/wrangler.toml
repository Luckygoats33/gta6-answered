name = "calluncgta-ask"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# "claude-opus-5-5" gives smarter answers at ~40x the cost.
MODEL = "claude-haiku-5-5"
ALLOWED_ORIGINS = "https://gta.callunc.com,http://localhost:8765"

# Per-visitor limit: 8 questions a minute.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1001"
simple = { limit = 8, period = 60 }
