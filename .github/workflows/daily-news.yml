name: Daily GTA 6 news

on:
  schedule:
    - cron: "0 12 * * *"   # every day at 12:00 UTC (7am US Eastern)
  workflow_dispatch: {}      # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull headlines
        run: python tools/fetch_news.py
      - name: Rebuild site
        run: python build.py
      - name: Commit and push if anything changed
        run: |
          git config user.name "calluncgta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json docs worker/src/kb.ts
          if git diff --cached --quiet; then
            echo "No new headlines."
            exit 0
          fi
          git commit -m "Daily news refresh $(date -u +%Y-%m-%d)"
          git push
          echo "PUSHED=1" >> "$GITHUB_ENV"
      - name: Ping Bing (IndexNow)
        if: env.PUSHED == '1'
        run: python tools/indexnow.py || true
